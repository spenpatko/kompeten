      border: 1px solid #E2E8F0;
      border-radius: 1rem;
      box-shadow: 0 1px 2px 0 rgba(15, 23, 42, 0.04);

    .edtech-grid-bg {
      background-color: #F8FAFC;
      background-image:

      width: 6px;
      height: 6px;

    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    #simbangkom-root::-webkit-scrollbar-thumb,

      background: #CBD5E1;
      border-radius: 9999px;
    }
    #simbangkom-root::-webkit-scrollbar-thumb:hover,
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }

    /* Animations */
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up {
      animation: fadeSlideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;

      body * {

        top: 0 !important;

    function loadLocalData() {
      try {
        const savedUsers = localStorage.getItem(STORAGE_KEYS.USERS);
        const savedReports = localStorage.getItem(STORAGE_KEYS.REPORTS);
        const savedSession = localStorage.getItem(STORAGE_KEYS.SESSION);

        state.users = savedUsers ? JSON.parse(savedUsers) : [...INITIAL_USERS];
        state.reports = savedReports ? JSON.parse(savedReports) : [...INITIAL_REPORTS];

        if (!savedUsers) localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(state.users));
        if (!savedReports) localStorage.setItem(STORAGE_KEYS.REPORTS, JSON.stringify(state.reports));

        if (savedSession) {
          const parsedUser = JSON.parse(savedSession);
          const freshUser = state.users.find((u) => u.Username === parsedUser.Username) || parsedUser;
          state.currentUser = freshUser;
        }
      } catch (e) {
        state.users = [...INITIAL_USERS];
        state.reports = [...INITIAL_REPORTS];
      }
    }

    function persistLocalData() {
      try {
        localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(state.users));
        localStorage.setItem(STORAGE_KEYS.REPORTS, JSON.stringify(state.reports));
        if (state.currentUser) {
          localStorage.setItem(STORAGE_KEYS.SESSION, JSON.stringify(state.currentUser));
        } else {
          localStorage.removeItem(STORAGE_KEYS.SESSION);
        }
      } catch (e) {
        // Handle quota exceeded silently
      }
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatDateIndo(dateStr) {
      if (!dateStr) return "-";
      const parts = dateStr.split("-");
      if (parts.length !== 3) return dateStr;
      const months = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
      const mIdx = parseInt(parts[1], 10) - 1;
      return `${parts[2]} ${months[mIdx] || parts[1]} ${parts[0]}`;
    }

    function getCurrentTimestamp() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
    }

        },

          wrap: "bg-white border-amber-200 text-slate-800 shadow-lg shadow-amber-900/5",
          iconWrap: "bg-amber-50 text-amber-600",
          icon: "alert-triangle"
        },
        info: {
          wrap: "bg-white border-blue-200 text-slate-800 shadow-lg shadow-blue-900/5",
          iconWrap: "bg-blue-50 text-blue-600",
          icon: "info"
        }
      };

      const cfg = styles[type] || styles.info;
      const toastEl = document.createElement("div");
      toastEl.className = `pointer-events-auto flex items-start gap-3 p-3.5 rounded-2xl border ${cfg.wrap} animate-fade-up transition-all duration-300`;
      toastEl.innerHTML = `
        <div class="w-8 h-8 rounded-xl ${cfg.iconWrap} flex items-center justify-center shrink-0 mt-0.5">
          <i data-lucide="${cfg.icon}" class="w-4 h-4"></i>
        </div>
        <div class="flex-1 text-xs sm:text-sm font-medium leading-relaxed text-slate-700">${escapeHtml(message)}</div>
        <button type="button" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg" onclick="this.parentElement.remove()">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      `;

      container.appendChild(toastEl);
      if (window.lucide) lucide.createIcons();

      setTimeout(() => {
        if (toastEl.parentElement) {
          toastEl.style.opacity = "0";
          toastEl.style.transform = "translateY(-6px)";
          setTimeout(() => toastEl.remove(), 250);
        }
      }, 4200);
    }

    // =========================================================================

    async function apiCall(action, payload = {}) {
      if (!IS_PREVIEW) {
        try {
          const response = await fetch(GAS_URL, {
            method: "POST",
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({ action, ...payload })
          });
          const result = await response.json();
          return result;
        } catch (error) {
          return {
            success: false,
            message: "Gagal terhubung ke server Google Apps Script. Periksa koneksi internet atau URL deployment."
          };
        }
      }

      // Simulated asynchronous latency for IS_PREVIEW = true
      await new Promise((resolve) => setTimeout(resolve, 220));

      switch (action) {
        case "login": {
          const uname = (payload.username || "").trim().toLowerCase();
          const pwd = payload.password || "";
          const found = state.users.find((u) => {
            if (u.Username.toLowerCase() !== uname) return false;
            if (uname === "admin" && (pwd === "edudigital" || pwd === "admin2026" || pwd === u.Password)) return true;
            return u.Password === pwd;
          });
          if (!found) {
            return { success: false, message: "Username atau kata sandi tidak valid." };
          }
          return { success: true, user: found };
        }

        case "getDashboardData": {

            success: true,
            users: state.users,
            reports: state.reports
          };
        }

            ID_Laporan: newId,
            Timestamp: getCurrentTimestamp(),
            Username: payload.Username,
            Nama_GTK: payload.Nama_GTK,
            NIP_NUPTK: payload.NIP_NUPTK,
            Status_Pegawai: payload.Status_Pegawai,
            Judul_Kegiatan: payload.Judul_Kegiatan,
            Jenis_Kegiatan: payload.Jenis_Kegiatan,
            Penyelenggara: payload.Penyelenggara,
            Tingkat: payload.Tingkat,
            Moda: payload.Moda,
            Tgl_Mulai: payload.Tgl_Mulai,
            Tgl_Selesai: payload.Tgl_Selesai,

          state.reports.unshift(record);
          persistLocalData();
          return { success: true, report: record, message: "Laporan berhasil dikirim dan menunggu validasi." };

        case "updateReportRevision": {
          const idx = state.reports.findIndex((r) => r.ID_Laporan === payload.ID_Laporan);
          if (idx === -1) return { success: false, message: "Laporan tidak ditemukan." };
          state.reports[idx] = {

          };
          persistLocalData();
          return { success: true, report: state.reports[idx], message: "Perbaikan laporan berhasil dikirim ulang." };
        }

        case "verifyReport": {
          const idx = state.reports.findIndex((r) => r.ID_Laporan === payload.ID_Laporan);
          if (idx === -1) return { success: false, message: "Data laporan tidak ditemukan." };
          state.reports[idx].Status_Verifikasi = payload.Status_Verifikasi;
          state.reports[idx].Catatan_Admin = payload.Catatan_Admin || "";
          state.reports[idx].Validator = payload.Validator || state.currentUser?.Nama_Lengkap || "Admin";
          persistLocalData();
          return { success: true, report: state.reports[idx], message: `Status laporan diperbarui menjadi "${payload.Status_Verifikasi}".` };
        }

        case "deleteReport": {
          state.reports = state.reports.filter((r) => r.ID_Laporan !== payload.ID_Laporan);
          persistLocalData();
          return { success: true, message: "Laporan berhasil dihapus dari sistem." };
        }

        case "saveUser": {
          if (payload.ID_User) {
            const idx = state.users.findIndex((u) => u.ID_User === payload.ID_User);
            if (idx === -1) return { success: false, message: "Data GTK tidak ditemukan." };
            const duplicate = state.users.some(
              (u) => u.Username.toLowerCase() === payload.Username.trim().toLowerCase() && u.ID_User !== payload.ID_User
            );
            if (duplicate) return { success: false, message: "Username sudah digunakan oleh akun lain." };
            state.users[idx] = {
              ...state.users[idx],
              Username: payload.Username.trim(),
              Nama_Lengkap: payload.Nama_Lengkap.trim(),

              Unit_Mapel: payload.Unit_Mapel.trim(),
              Role: payload.Role
            };
            if (state.currentUser && state.currentUser.ID_User === payload.ID_User) {
              state.currentUser = { ...state.users[idx] };
            }
            persistLocalData();
            return { success: true, message: "Data GTK berhasil diperbarui." };
          } else {
            const duplicate = state.users.some(
              (u) => u.Username.toLowerCase() === payload.Username.trim().toLowerCase()
            );
            if (duplicate) return { success: false, message: "Username sudah terdaftar. Gunakan username lain." };
            const newUser = {
              ID_User: "USR-" + String(state.users.length + 1).padStart(3, "0"),
              Username: payload.Username.trim(),
              Password: payload.Password || "edudigital",
              Nama_Lengkap: payload.Nama_Lengkap.trim(),
              NIP_NUPTK: payload.NIP_NUPTK.trim(),
              Status_Pegawai: payload.Status_Pegawai,
              Unit_Mapel: payload.Unit_Mapel.trim(),
              Role: payload.Role || "Peserta",
              Created_At: getCurrentTimestamp()
            };
            state.users.push(newUser);
            persistLocalData();
            return { success: true, user: newUser, message: "Akun GTK baru berhasil ditambahkan." };
          }
        }

        case "resetUserPassword": {
          const idx = state.users.findIndex((u) => u.ID_User === payload.ID_User);
          if (idx === -1) return { success: false, message: "Akun tidak ditemukan." };
          state.users[idx].Password = payload.newPassword || "edudigital";
          persistLocalData();
          return { success: true, message: `Kata sandi ${state.users[idx].Nama_Lengkap} berhasil direset.` };
        }

        case "deleteUser": {
          state.users = state.users.filter((u) => u.ID_User !== payload.ID_User);
          persistLocalData();
          return { success: true, message: "Akun GTK berhasil dihapus." };
        }

        case "changeOwnPassword": {
          const idx = state.users.findIndex((u) => u.ID_User === payload.ID_User);
          if (idx === -1) return { success: false, message: "Akun tidak ditemukan." };
          const user = state.users[idx];
          const validOld =
            user.Password === payload.oldPassword ||
            (user.Username === "admin" && (payload.oldPassword === "admin2026" || payload.oldPassword === "edudigital"));
          if (!validOld) {
            return { success: false, message: "Kata sandi lama tidak sesuai." };
          }
          state.users[idx].Password = payload.newPassword;
          state.currentUser = { ...state.users[idx] };
          persistLocalData();
          return { success: true, message: "Kata sandi Anda berhasil diperbarui." };
        }

        default:
          return { success: false, message: "Aksi tidak dikenali." };
      }
    }

    function initWizardFormForUser(forceClean = false) {
      const user = state.currentUser;
      const defaultForm = {
        Nama_GTK: user ? user.Nama_Lengkap : "",
        NIP_NUPTK: user ? user.NIP_NUPTK : "",
        Status_Pegawai: user ? user.Status_Pegawai : "Guru",
        Jenis_Kegiatan: "Bimtek",
        Penyelenggara: "",
        Tingkat: "Provinsi",
        Tgl_Mulai: "",
        Tgl_Selesai: "",
        Moda: "Daring",
        Jumlah_JP: 8,
        Judul_Kegiatan: "",
        Ringkasan_Materi: "",
        Dampak_Pembelajaran: "",
        Rencana_Tindak_Lanjut: "",
        certFileName: "",
        certFileData: "",
        certFileType: "",
        docFileName: "",
        docFileData: "",
        docFileType: ""
      };

      if (!forceClean && !state.editingReportId) {
        try {
          const savedDraft = localStorage.getItem(STORAGE_KEYS.DRAFT);
          if (savedDraft) {
            const parsed = JSON.parse(savedDraft);
            if (parsed && parsed.username === user?.Username && parsed.form) {
              state.wizardForm = { ...defaultForm, ...parsed.form };
              state.wizardStep = parsed.step || 1;
              state.draftSavedAt = parsed.savedAt || "Baru saja";
              return;
            }
          }
        } catch (e) {}
      }

      state.wizardForm = defaultForm;
      state.wizardStep = 1;
      state.draftSavedAt = null;
    }

    function autoSaveDraft() {
      if (state.editingReportId || !state.currentUser) return;
      try {
        const now = new Date();
        const timeStr = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}:${String(now.getSeconds()).padStart(2, "0")}`;
        // Exclude large base64 strings if storage is tight
        const formToSave = { ...state.wizardForm };
        if (formToSave.certFileData && formToSave.certFileData.length > 500000) formToSave.certFileData = "";
        if (formToSave.docFileData && formToSave.docFileData.length > 500000) formToSave.docFileData = "";

        localStorage.setItem(
          STORAGE_KEYS.DRAFT,
          JSON.stringify({
            username: state.currentUser.Username,
            step: state.wizardStep,
            savedAt: timeStr,
            form: formToSave
          })
        );
        state.draftSavedAt = timeStr;
        const badge = document.getElementById("draft-autosave-badge");
        if (badge) {
          badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span> Draft tersimpan otomatis (${timeStr})`;
        }
      } catch (e) {}
    }

    function clearSavedDraft() {
      try {
        localStorage.removeItem(STORAGE_KEYS.DRAFT);
      } catch (e) {}
      state.editingReportId = null;
      state.editingRevisionNote = "";
      initWizardFormForUser(true);
    }

    function bindLoginEvents() {
      const form = document.getElementById("login-form");
      const pwdInput = document.getElementById("login-password");
      const toggleBtn = document.getElementById("toggle-password-btn");
      const errBox = document.getElementById("login-error-box");
      const errText = document.getElementById("login-error-text");

      if (toggleBtn && pwdInput) {
        toggleBtn.onclick = () => {
          const isPwd = pwdInput.type === "password";
          pwdInput.type = isPwd ? "text" : "password";
          toggleBtn.innerHTML = `<i data-lucide="${isPwd ? "eye-off" : "eye"}" class="w-4 h-4"></i>`;
          if (window.lucide) lucide.createIcons();
        };
      }

      async function handleLogin(username, password) {
        const submitBtn = document.getElementById("login-submit-btn");
        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Memverifikasi...</span>`;
          if (window.lucide) lucide.createIcons();
        }
        if (errBox) errBox.classList.add("hidden");

        const res = await apiCall("login", { username, password });
        if (res.success && res.user) {
          state.currentUser = res.user;
          state.activeTab = "dashboard";
          persistLocalData();
          initWizardFormForUser(false);

          if (!IS_PREVIEW) {
            const syncRes = await apiCall("getDashboardData", { username: res.user.Username, role: res.user.Role });
            if (syncRes.success) {
              if (Array.isArray(syncRes.reports)) state.reports = syncRes.reports;
              if (Array.isArray(syncRes.users)) state.users = syncRes.users;
            }
          }

          showToast(`Selamat datang kembali, ${res.user.Nama_Lengkap}!`, "success");
          renderApp();
        } else {
          if (errBox && errText) {
            errText.textContent = res.message || "Gagal masuk. Periksa username & kata sandi.";
            errBox.classList.remove("hidden");
          }
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<span>Masuk Sekarang</span><i data-lucide="arrow-right" class="w-4 h-4"></i>`;
            if (window.lucide) lucide.createIcons();
          }
        }
      }

      if (form) {
        form.onsubmit = (e) => {
          e.preventDefault();
          const u = document.getElementById("login-username").value;
          const p = document.getElementById("login-password").value;
          handleLogin(u, p);
        };
      }

      const demoAdmin = document.getElementById("demo-login-admin");
      if (demoAdmin) {
        demoAdmin.onclick = () => {
          document.getElementById("login-username").value = "admin";
          document.getElementById("login-password").value = "edudigital";
          handleLogin("admin", "edudigital");
        };
      }

      const demoPeserta = document.getElementById("demo-login-peserta");
      if (demoPeserta) {
        demoPeserta.onclick = () => {
          document.getElementById("login-username").value = "peserta";
          document.getElementById("login-password").value = "edudigital";
          handleLogin("peserta", "edudigital");
        };
      }
    }

    function getInitials(fullName) {
      if (!fullName) return "GT";
      const clean = fullName.replace(/,.*$/, "").trim();
      const parts = clean.split(/\s+/);
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[1][0]).toUpperCase();
    }

    function bindMainShellEvents() {
      // Navigation buttons
      document.querySelectorAll("[data-nav]").forEach((btn) => {
        btn.onclick = () => {
          const target = btn.getAttribute("data-nav");
          if (target === "input" && state.activeTab !== "input" && !state.editingReportId) {
            initWizardFormForUser(false);
          }
          state.activeTab = target;
          renderApp();
          const root = document.getElementById("simbangkom-root");
          if (root) root.scrollTo({ top: 0, behavior: "smooth" });
        };
      });

      // Logout buttons
      const handleLogout = () => {
        openConfirmModal({
          title: "Keluar?",
          message: "Sesi Anda akan diakhiri. Draft laporan yang belum dikirim tetap tersimpan aman di perangkat ini.",
          confirmLabel: "Ya, Keluar",
          danger: true,
          onConfirm: () => {
            state.currentUser = null;
            persistLocalData();
            renderApp();
            showToast("Anda telah keluar dari sistem.", "info");
          }
        });
      };

      const desktopLogout = document.getElementById("desktop-logout-btn");
      if (desktopLogout) desktopLogout.onclick = handleLogout;

      const mobileLogout = document.getElementById("mobile-logout-btn");
      if (mobileLogout) mobileLogout.onclick = handleLogout;

      // Reset Demo Data
      const resetDemoBtn = document.getElementById("reset-demo-data-btn");
      if (resetDemoBtn) {
        resetDemoBtn.onclick = () => {
          openConfirmModal({
            title: "Reset Data Simulasi?",
            message: "Seluruh data laporan dan akun uji coba akan dikembalikan ke kondisi awal default.",
            confirmLabel: "Reset Sekarang",
            danger: true,
            onConfirm: () => {
              state.users = [...INITIAL_USERS];
              state.reports = [...INITIAL_REPORTS];
              persistLocalData();
              renderApp();
              showToast("Data simulasi berhasil dikembalikan ke kondisi awal.", "success");
            }
          });
        };
      }

      // Mobile Install Trigger
      const mobileInstallBtn = document.getElementById("mobile-install-trigger");
      if (mobileInstallBtn) {
        mobileInstallBtn.onclick = () => showInstallBanner(true);
      }

      // Mobile Quick Print Portfolio
      const mobilePrintBtn = document.getElementById("mobile-quick-portfolio-btn");
      if (mobilePrintBtn) {
        mobilePrintBtn.onclick = () => printPersonalPortfolio();
      }

      // Bind active page specific events
      if (state.activeTab === "dashboard") bindDashboardEvents();
      if (state.activeTab === "input") bindWizardEvents();
      if (state.activeTab === "history") bindHistoryEvents();
      if (state.activeTab === "gtk") bindGtkEvents();
    }

    function renderActivePage() {
      switch (state.activeTab) {
        case "dashboard":
          return renderDashboardPage();
        case "input":
          return renderWizardPage();
        case "history":
          return renderHistoryPage();
        case "gtk":
          return renderGtkAndProfilePage();
        default:
          return renderDashboardPage();
      }
    }

      const user = state.currentUser;

        return renderAdminDashboard();
      }
      return renderPesertaDashboard();
    }

      const pendingReports = state.reports.filter((r) => r.Status_Verifikasi === "Menunggu");

      const goPendingBtn = document.getElementById("dash-go-pending-btn");

      const goPendingHandler = () => {
        state.historyStatusFilter = "Menunggu";
        state.activeTab = "history";
        renderApp();
      };
      if (goPendingBtn) goPendingBtn.onclick = goPendingHandler;
      if (pendingShortcut) pendingShortcut.onclick = goPendingHandler;

      const exportBtn = document.getElementById("dash-export-csv-btn");
      if (exportBtn) exportBtn.onclick = () => exportReportsCSV(state.reports);

      const printPortfolioBtn = document.getElementById("peserta-print-portfolio-btn");
      if (printPortfolioBtn) printPortfolioBtn.onclick = () => printPersonalPortfolio();

      document.querySelectorAll("[data-open-report]").forEach((el) => {
        el.onclick = () => {
          const id = el.getAttribute("data-open-report");
          openReportDetailModal(id);
        };
      });

      const stepsMeta = [

    function validateWizardStep(step) {
      const f = state.wizardForm;
      if (step === 1) {
        if (!f.Nama_GTK.trim() || !f.NIP_NUPTK.trim()) {
          showToast("Nama Lengkap dan NIP/NUPTK wajib diisi.", "warning");
          return false;
        }
        if (!f.Penyelenggara.trim()) {
          showToast("Instansi penyelenggara kegiatan wajib diisi.", "warning");
          return false;
        }
        return true;
      }
      if (step === 2) {
        if (!f.Tgl_Mulai || !f.Tgl_Selesai) {
          showToast("Tanggal mulai dan tanggal selesai wajib diisi.", "warning");
          return false;
        }
        if (f.Tgl_Selesai < f.Tgl_Mulai) {
          showToast("Tanggal selesai tidak boleh lebih awal dari tanggal mulai.", "warning");
          return false;
        }
        if (!f.Jumlah_JP || Number(f.Jumlah_JP) <= 0) {
          showToast("Jumlah Jam Pelajaran (JP) harus lebih dari 0.", "warning");
          return false;
        }
        return true;
      }
      if (step === 3) {
        if (!f.Judul_Kegiatan.trim()) {
          showToast("Judul lengkap kegiatan wajib diisi.", "warning");
          return false;
        }
        if (!f.Ringkasan_Materi.trim()) {
          showToast("Ringkasan materi utama wajib diisi.", "warning");
          return false;
        }
        if (!f.Rencana_Tindak_Lanjut.trim()) {
          showToast("Rencana Tindak Lanjut (RTL) wajib diisi.", "warning");
          return false;
        }
        return true;
      }
      if (step === 4) {
        if (!f.certFileName) {
          showToast("Silakan unggah file Sertifikat / Piagam kegiatan.", "warning");
          return false;
        }
        if (!f.docFileName) {
          showToast("Silakan unggah Foto Dokumentasi kegiatan.", "warning");
          return false;
        }
        return true;
      }
      return true;
    }

    function bindWizardEvents() {
      // Input bindings with auto-save draft
      document.querySelectorAll("[data-wf]").forEach((el) => {
        const field = el.getAttribute("data-wf");
        const handler = () => {
          state.wizardForm[field] = el.value;
          autoSaveDraft();
        };
        el.oninput = handler;
        el.onchange = handler;
      });

      // Step 1 Status Pegawai selector
      document.querySelectorAll("[data-select-status]").forEach((btn) => {
        btn.onclick = () => {
          state.wizardForm.Status_Pegawai = btn.getAttribute("data-select-status");
          autoSaveDraft();
          renderApp();
        };
      });

      // Step 1 Category selector
      document.querySelectorAll("[data-select-category]").forEach((btn) => {
        btn.onclick = () => {
          state.wizardForm.Jenis_Kegiatan = btn.getAttribute("data-select-category");
          autoSaveDraft();
          renderApp();
        };
      });

      // Step 2 Moda selector
      document.querySelectorAll("[data-select-moda]").forEach((btn) => {
        btn.onclick = () => {
          state.wizardForm.Moda = btn.getAttribute("data-select-moda");
          autoSaveDraft();
          renderApp();
        };
      });

      // Step 2 Quick JP chips
      document.querySelectorAll("[data-quick-jp]").forEach((btn) => {
        btn.onclick = () => {
          state.wizardForm.Jumlah_JP = Number(btn.getAttribute("data-quick-jp"));
          autoSaveDraft();
          renderApp();
        };
      });

      // Step 4 File Uploads
      const certInput = document.getElementById("upload-cert-input");
      if (certInput) {
        certInput.onchange = (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          if (file.size > 5 * 1024 * 1024) {
            showToast("Ukuran file sertifikat maksimal 5 MB.", "error");
            return;
          }
          const reader = new FileReader();
          reader.onload = () => {
            state.wizardForm.certFileName = file.name;
            state.wizardForm.certFileData = reader.result;
            state.wizardForm.certFileType = file.type;
            autoSaveDraft();
            renderApp();
            showToast("File sertifikat berhasil dilampirkan.", "success");
          };
          reader.readAsDataURL(file);
        };
      }

      const docInput = document.getElementById("upload-doc-input");
      if (docInput) {
        docInput.onchange = (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          if (file.size > 5 * 1024 * 1024) {
            showToast("Ukuran foto dokumentasi maksimal 5 MB.", "error");
            return;
          }
          const reader = new FileReader();
          reader.onload = () => {
            state.wizardForm.docFileName = file.name;
            state.wizardForm.docFileData = reader.result;
            state.wizardForm.docFileType = file.type;
            autoSaveDraft();
            renderApp();
            showToast("Foto dokumentasi berhasil dilampirkan.", "success");
          };
          reader.readAsDataURL(file);
        };
      }

      // Sample File Helpers for Quick Preview Testing
      const sampleCertBtn = document.getElementById("sample-cert-btn");
      if (sampleCertBtn) {
        sampleCertBtn.onclick = () => {
          state.wizardForm.certFileName = `Sertifikat_${state.wizardForm.Jenis_Kegiatan}_2026.pdf`;
          state.wizardForm.certFileType = "application/pdf";
          state.wizardForm.certFileData = "";
          autoSaveDraft();
          renderApp();
          showToast("Contoh file sertifikat terpasang.", "info");
        };
      }

      const sampleDocBtn = document.getElementById("sample-doc-btn");
      if (sampleDocBtn) {
        sampleDocBtn.onclick = () => {
          state.wizardForm.docFileName = `Dokumentasi_${state.wizardForm.Jenis_Kegiatan}_2026.jpg`;
          state.wizardForm.docFileType = "image/jpeg";
          state.wizardForm.docFileData = "";
          autoSaveDraft();
          renderApp();
          showToast("Contoh foto dokumentasi terpasang.", "info");
        };
      }

      // Stepper jump buttons
      document.querySelectorAll("[data-wizard-jump]").forEach((btn) => {
        btn.onclick = () => {
          const targetStep = Number(btn.getAttribute("data-wizard-jump"));
          if (targetStep < state.wizardStep || validateWizardStep(state.wizardStep)) {
            state.wizardStep = targetStep;
            autoSaveDraft();
            renderApp();
          }
        };
      });

      // Prev / Next / Submit
      const prevBtn = document.getElementById("wizard-prev-btn");
      if (prevBtn) {
        prevBtn.onclick = () => {
          if (state.wizardStep > 1) {
            state.wizardStep -= 1;
            autoSaveDraft();
            renderApp();
          }
        };
      }

      const nextBtn = document.getElementById("wizard-next-btn");
      if (nextBtn) {
        nextBtn.onclick = () => {
          if (validateWizardStep(state.wizardStep)) {
            state.wizardStep += 1;
            autoSaveDraft();
            renderApp();
            const root = document.getElementById("simbangkom-root");
            if (root) root.scrollTo({ top: 0, behavior: "smooth" });
          }
        };
      }

      const submitBtn = document.getElementById("wizard-submit-btn");
      if (submitBtn) {
        submitBtn.onclick = async () => {
          if (!validateWizardStep(4)) return;
          submitBtn.disabled = true;
          submitBtn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Mengirim Laporan...</span>`;
          if (window.lucide) lucide.createIcons();

          const payload = {
            ...state.wizardForm,
            Username: state.currentUser.Username,
            ID_Laporan: state.editingReportId || undefined
          };

          const actionName = state.editingReportId ? "updateReportRevision" : "submitReport";
          const res = await apiCall(actionName, payload);

          if (res.success) {
            clearSavedDraft();
            state.activeTab = "history";
            renderApp();
            showToast(res.message || "Laporan berhasil disimpan!", "success");
          } else {
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<i data-lucide="send" class="w-4 h-4"></i><span>Kirim Laporan</span>`;
            if (window.lucide) lucide.createIcons();
            showToast(res.message || "Gagal mengirim laporan.", "error");
          }
        };
      }

      // Reset Draft
      const resetBtn = document.getElementById("wizard-reset-draft-btn");
      if (resetBtn) {
        resetBtn.onclick = () => {
          openConfirmModal({
            title: "Reset Formulir Laporan?",
            message: "Semua isian pada wizard ini akan dikosongkan kembali ke awal.",
            confirmLabel: "Ya, Reset",
            danger: true,
            onConfirm: () => {
              clearSavedDraft();
              renderApp();
              showToast("Formulir laporan telah direset.", "info");
            }
          });
        };
      }

      // Cancel Revision Mode
      const cancelRevBtn = document.getElementById("cancel-revision-mode-btn");
      if (cancelRevBtn) {
        cancelRevBtn.onclick = () => {
          clearSavedDraft();
          state.activeTab = "history";
          renderApp();
        };
      }
    }

    // =========================================================================
    // 13. MENU 3: RIWAYAT & VALIDASI (SEARCH, FILTER, CSV, MODAL, PRINT)

    function getFilteredReports() {
      const user = state.currentUser;
      const isAdmin = user.Role === "Admin";
      const q = state.historySearch.trim().toLowerCase();

      return state.reports.filter((r) => {
        if (!isAdmin && r.Username !== user.Username) return false;
        if (state.historyStatusFilter !== "Semua" && r.Status_Verifikasi !== state.historyStatusFilter) return false;
        if (state.historyCategoryFilter !== "Semua" && r.Jenis_Kegiatan !== state.historyCategoryFilter) return false;
        if (q) {
          const hay = `${r.ID_Laporan} ${r.Judul_Kegiatan} ${r.Nama_GTK} ${r.Penyelenggara} ${r.Jenis_Kegiatan}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    function bindHistoryEvents() {
      const searchInput = document.getElementById("history-search-input");
      if (searchInput) {
        searchInput.oninput = (e) => {
          state.historySearch = e.target.value;
          renderApp();
          const newInput = document.getElementById("history-search-input");
          if (newInput) {
            newInput.focus();
            newInput.setSelectionRange(newInput.value.length, newInput.value.length);
          }
        };
      }

      const catSelect = document.getElementById("history-category-select");
      if (catSelect) {
        catSelect.onchange = (e) => {
          state.historyCategoryFilter = e.target.value;
          renderApp();
        };
      }

      document.querySelectorAll("[data-status-pill]").forEach((btn) => {
        btn.onclick = () => {
          state.historyStatusFilter = btn.getAttribute("data-status-pill");
          renderApp();
        };
      });

      const resetFiltersBtn = document.getElementById("reset-history-filters-btn");
      if (resetFiltersBtn) {
        resetFiltersBtn.onclick = () => {
          state.historySearch = "";
          state.historyStatusFilter = "Semua";
          state.historyCategoryFilter = "Semua";
          renderApp();
        };
      }

      const exportBtn = document.getElementById("history-export-csv-btn");
      if (exportBtn) {
        exportBtn.onclick = () => exportReportsCSV(getFilteredReports());
      }

      document.querySelectorAll("[data-open-report]").forEach((el) => {
        el.onclick = () => {
          openReportDetailModal(el.getAttribute("data-open-report"));
        };
      });
    }

    function bindGtkEvents() {
      const printBtn = document.getElementById("profile-print-portfolio-btn");
      if (printBtn) printBtn.onclick = () => printPersonalPortfolio();

      // Own password form
      const pwdForm = document.getElementById("change-own-password-form");
      if (pwdForm) {
        pwdForm.onsubmit = async (e) => {
          e.preventDefault();
          const oldPassword = document.getElementById("own-old-pwd").value;
          const newPassword = document.getElementById("own-new-pwd").value;
          const confirmPassword = document.getElementById("own-confirm-pwd").value;

          if (newPassword !== confirmPassword) {
            showToast("Konfirmasi kata sandi baru tidak cocok.", "error");
            return;
          }

          const res = await apiCall("changeOwnPassword", {
            ID_User: state.currentUser.ID_User,
            oldPassword,
            newPassword
          });

          if (res.success) {
            pwdForm.reset();
            showToast(res.message, "success");
          } else {
            showToast(res.message, "error");
          }
        };
      }

      // Admin search GTK
      const gtkSearchInput = document.getElementById("gtk-search-input");
      if (gtkSearchInput) {
        gtkSearchInput.oninput = (e) => {
          state.gtkSearch = e.target.value;
          renderApp();
          const inp = document.getElementById("gtk-search-input");
          if (inp) {
            inp.focus();
            inp.setSelectionRange(inp.value.length, inp.value.length);
          }
        };
      }

      // Add GTK Modal
      const addGtkBtn = document.getElementById("open-add-gtk-modal-btn");
      if (addGtkBtn) {
        addGtkBtn.onclick = () => openUserFormModal(null);
      }

      // Edit GTK
      document.querySelectorAll("[data-edit-user]").forEach((btn) => {
        btn.onclick = () => {
          const u = state.users.find((x) => x.ID_User === btn.getAttribute("data-edit-user"));
          if (u) openUserFormModal(u);
        };
      });

      // Reset Password Modal
      document.querySelectorAll("[data-reset-pwd]").forEach((btn) => {
        btn.onclick = () => {
          const u = state.users.find((x) => x.ID_User === btn.getAttribute("data-reset-pwd"));
          if (u) openResetPasswordModal(u);
        };
      });

      // Delete User
      document.querySelectorAll("[data-delete-user]").forEach((btn) => {
        btn.onclick = () => {
          const u = state.users.find((x) => x.ID_User === btn.getAttribute("data-delete-user"));
          if (!u) return;
          openConfirmModal({
            title: "Hapus Akun GTK?",
            message: `Akun "${u.Nama_Lengkap}" (${u.Username}) akan dihapus dari master data.`,
            confirmLabel: "Ya, Hapus Akun",
            danger: true,
            onConfirm: async () => {
              const res = await apiCall("deleteUser", { ID_User: u.ID_User });
              if (res.success) {
                renderApp();
                showToast(res.message, "success");
              }
            }
          });
        };
      });
    }

    function exportReportsCSV(reportList) {
      if (!reportList || reportList.length === 0) {
        showToast("Tidak ada data laporan untuk diekspor.", "warning");
        return;
      }

      const headers = [
        "ID_Laporan",
        "Timestamp",
        "Username",
        "Nama_GTK",
        "NIP_NUPTK",
        "Status_Pegawai",
        "Judul_Kegiatan",
        "Jenis_Kegiatan",
        "Penyelenggara",
        "Tingkat",
        "Moda",
        "Tgl_Mulai",
        "Tgl_Selesai",
        "Jumlah_JP",
        "Ringkasan_Materi",
        "Rencana_Tindak_Lanjut",
        "Link_Sertifikat",
        "Link_Dokumentasi",
        "Status_Verifikasi",
        "Catatan_Admin",
        "Validator"
      ];

      const escapeCsv = (val) => {
        const str = val === null || val === undefined ? "" : String(val);
        return `"${str.replace(/"/g, '""')}"`;
      };

      const rows = [
        headers.join(","),
        ...reportList.map((r) => headers.map((h) => escapeCsv(r[h])).join(","))
      ];

      // Add UTF-8 BOM for clean Excel compatibility in Indonesian locales
      const csvContent = "\uFEFF" + rows.join("\r\n");
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `Rekap_SIM_BANGKOM_GTK_${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      showToast(`Berhasil mengunduh rekap CSV (${reportList.length} laporan).`, "success");
    }

    function initSmartInstallBanner() {
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        state.deferredPrompt = e;
        showInstallBanner(false);
      });

      // Show iOS Safari or helpful install prompt if not dismissed & not standalone
      const isStandalone =
        window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
      const isDismissed = localStorage.getItem(STORAGE_KEYS.INSTALL_DISMISSED) === "true";

      if (!isStandalone && !isDismissed) {
        setTimeout(() => {
          showInstallBanner(false);
        }, 2500);
      }
    }

    function showInstallBanner(forceShow = false) {
      const banner = document.getElementById("pwa-install-banner");
      if (!banner) return;

      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      const hasNativePrompt = Boolean(state.deferredPrompt);

      if (!forceShow && !hasNativePrompt && !isIOS) {
        return;
      }

      banner.innerHTML = `
        <div class="glass-nav-float rounded-2xl p-4 border border-blue-200/80 shadow-xl">
          <div class="flex items-start gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-teal-600 text-white flex items-center justify-center shrink-0 shadow-xs">
              <i data-lucide="smartphone" class="w-5 h-5"></i>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between gap-2">
                <h4 class="text-xs font-extrabold text-slate-900">Instal KOMPETEN</h4>
                <button type="button" id="dismiss-install-banner-btn" class="text-slate-400 hover:text-slate-600 p-0.5">
                  <i data-lucide="x" class="w-4 h-4"></i>
                </button>
              </div>
              <p class="text-[11px] text-slate-600 mt-1 leading-relaxed">
                ${
                  isIOS
                    ? `Ketuk ikon <strong>Bagikan (Share)</strong> di Safari lalu pilih <strong>"Tambah ke Layar Utama"</strong> untuk akses cepat layar penuh.`
                    : `Pasang aplikasi ke layar utama perangkat Anda untuk akses cepat satu ketukan & dukungan offline.`
                }
              </p>
              ${
                !isIOS
                  ? `<div class="mt-2.5 flex items-center gap-2">
                      <button type="button" id="trigger-native-install-btn" class="px-3.5 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-[11px] font-bold shadow-xs transition">
                        Pasang Sekarang
                      </button>
                      <button type="button" id="later-install-btn" class="px-2.5 py-1.5 rounded-xl text-[11px] font-semibold text-slate-500 hover:text-slate-700">
                        Nanti Saja
                      </button>
                    </div>`
                  : ""
              }
            </div>
          </div>
        </div>
      `;

      banner.classList.remove("hidden");
      if (window.lucide) lucide.createIcons();

      const closeBanner = () => {
        banner.classList.add("hidden");
        localStorage.setItem(STORAGE_KEYS.INSTALL_DISMISSED, "true");
      };

      const dismissBtn = document.getElementById("dismiss-install-banner-btn");
      if (dismissBtn) dismissBtn.onclick = closeBanner;

      const laterBtn = document.getElementById("later-install-btn");
      if (laterBtn) laterBtn.onclick = closeBanner;

      const installBtn = document.getElementById("trigger-native-install-btn");
      if (installBtn) {
        installBtn.onclick = async () => {
          if (state.deferredPrompt) {
            state.deferredPrompt.prompt();
            const choice = await state.deferredPrompt.userChoice;
            state.deferredPrompt = null;
            if (choice && choice.outcome === "accepted") {
              showToast("Aplikasi KOMPETEN sedang dipasang!", "success");
            }
            closeBanner();
          } else {
            showToast("Gunakan menu browser (⋮) lalu pilih 'Instal Aplikasi' / 'Tambahkan ke Layar Utama'.", "info");
            closeBanner();
          }
        };
      }
    }

    // =========================================================================
    // 18. BOOTSTRAP APPLICATION ON LOAD
    // =========================================================================
    window.addEventListener("DOMContentLoaded", () => {
      loadLocalData();
      if (state.currentUser) {
        initWizardFormForUser(false);
      }
      renderApp();
      initSmartInstallBanner();
    });
  </script>
</body>
</html>
